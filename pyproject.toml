[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-icon-pipeline"
version = "0.1.0"
description = "CLI-first scaffold for a game icon asset generation pipeline."
requires-python = ">=3.9"
dependencies = ["google-genai>=1.0.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
ai-icon-pipeline = "ai_icon_pipeline.cli:main"
ai-icon-pipeline-ui = "ai_icon_pipeline.ui_launcher:main"
ai-icon-pipeline-api = "ai_icon_pipeline.api_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
