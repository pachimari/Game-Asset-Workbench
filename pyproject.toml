[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-icon-pipeline"
version = "0.1.0"
description = "CLI-first scaffold for an AI skill icon generation pipeline."
requires-python = ">=3.9"

[project.scripts]
ai-icon-pipeline = "ai_icon_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
