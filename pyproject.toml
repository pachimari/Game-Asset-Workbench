[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-icon-pipeline"
version = "0.1.0"
description = "Local-first workbench for generating, reviewing, and exporting game assets."
requires-python = ">=3.9"
dependencies = ["google-genai>=1.0.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
ai-icon-pipeline = "ai_icon_pipeline.cli:main"
ai-icon-pipeline-api = "ai_icon_pipeline.api_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
